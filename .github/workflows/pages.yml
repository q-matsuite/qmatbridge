name: Deploy site

# Publishes the landing page (website/) at the root and the MkDocs site at /docs/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build docs
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict --site-dir _site/docs

      - name: Add landing page
        run: |
          if [ -d website ]; then cp -R website/. _site/; fi
          if [ ! -f _site/index.html ]; then
            echo '<meta http-equiv="refresh" content="0; url=docs/">' > _site/index.html
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
