name: Feature request
description: Propose a new adapter, exporter, schema field, or other enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Before opening a feature request, please check
        [GitHub Discussions](https://github.com/rmsreis/qmatbridge/discussions)
        to see if this has already been proposed.
        For **schema changes** to `QMatEntry` or nested classes, please open a
        Discussion tagged `schema` first — see
        [CONTRIBUTING.md](../../CONTRIBUTING.md) for the process.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Schema / NIR
        - Database adapter
        - Hamiltonian exporter
        - I/O / serialization
        - Documentation
        - CI / infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: >
        What problem does this solve? Which research workflow does it unblock?
        Which algorithm or resource-estimation method would benefit?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        Concrete description of the change — new fields, function signatures,
        module layout, etc.  Code sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out and why.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions for duplicates.
          required: true
        - label: >
            For schema changes, I understand this requires a discussion period
            before a PR is opened (see CONTRIBUTING.md).
          required: false
