[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmatbridge"
version = "0.4.0"
description = "Bridge from classical materials databases to first-quantized Hamiltonians for quantum simulation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Roberto dos Reis", email = "robertomsreis@gmail.com" }]
keywords = [
    "quantum computing",
    "quantum simulation",
    "materials science",
    "Hamiltonian simulation",
    "block encoding",
    "fault tolerant",
    "resource estimation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "numpy>=1.24",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# Current mp-api / emmet-core releases need Python 3.11+.  Without the marker, pip on
# 3.10 installs a stack whose import fails; with it, the extra is simply empty there
# and the adapter explains what to do.
mp = [
    "mp-api>=0.41; python_version >= '3.11'",
    "pymatgen>=2024.1; python_version >= '3.11'",
]
ase = [
    "ase>=3.22",
]
numpy = [
    "numpy>=1.24",
]
openfermion = [
    "openfermion>=1.6",
]

[project.urls]
Homepage = "https://github.com/q-matsuite/qmatbridge"
Repository = "https://github.com/q-matsuite/qmatbridge"
Issues = "https://github.com/q-matsuite/qmatbridge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qmatbridge*"]

[tool.setuptools.package-data]
qmatbridge = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short -m 'not integration'"
markers = [
    "integration: tests that call external APIs; require env vars (skip in CI unless set)",
]
